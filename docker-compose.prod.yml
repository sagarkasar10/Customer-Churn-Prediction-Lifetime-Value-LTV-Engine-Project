# docker-compose.prod.yml
version: '3.8'

services:
  db:
    image: postgres:14-alpine
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - churn_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod 
    env_file:
      - .env
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - churn_network

  metabase:
    image: metabase/metabase:latest
    ports:
      - "${METABASE_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - churn_network

volumes:
  pgdata:

networks:
  churn_network:
    driver: bridge